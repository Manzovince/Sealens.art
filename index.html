                                <line x1="110" y1="63" x2="112" y2="74" />
                            </svg>
                            <div id="wall-sheet"><img id="wall-img" alt="" decoding="async"></div>
                        </div>
                        <figcaption data-lg="prints-scale"></figcaption>
                    </figure>

                    <ul class="print-facts">
                        <li data-lg="prints-fact-paper"></li>
                        <li data-lg="prints-fact-signed"></li>
                        <li data-lg="prints-fact-card"></li>
                        <li data-lg="prints-fact-ship"></li>
                    </ul>

                    <div class="print-buy">
                        <p class="print-price"><span id="print-price"></span> <small data-lg="prints-shipping"></small></p>
                        <button id="print-order" class="print-button" data-lg="prints-order"></button>
                    </div>
                    <!-- The order: a form that writes the e-mail -->
                    <form id="order-form" hidden>
                        <h3 data-lg="order-title" tabindex="-1"></h3>
                        <p id="order-summary"></p>
                        <label><span data-lg="order-name"></span><input name="name" autocomplete="name" required></label>
                        <label><span data-lg="order-address"></span><textarea name="address" rows="2" autocomplete="street-address" required></textarea></label>
                        <div class="order-row">
                            <label><span data-lg="order-zip"></span><input name="zip" autocomplete="postal-code" required></label>
                            <label><span data-lg="order-city"></span><input name="city" autocomplete="address-level2" required></label>
                        </div>
                        <label><span data-lg="order-country"></span><input name="country" autocomplete="country-name" required></label>
                        <label><span data-lg="order-phone"></span><input name="phone" type="tel" autocomplete="tel"></label>
                        <label><span data-lg="order-gift"></span><textarea name="gift" rows="2"></textarea></label>
                        <p class="order-note" data-lg="order-payment"></p>
                        <button type="submit" class="print-button" data-lg="order-send"></button>
                        <div id="order-sent" hidden>
                            <p data-lg="order-sent"></p>
                            <p><span data-lg="order-fallback"></span> <a id="order-email"></a></p>
                            <button type="button" id="order-copy" class="story-choice" data-lg="order-copy"></button>
                        </div>
                    </form>
                </div>
            </div>

        </article>
    </section>

    <!-- Music player -->
    <div id="player"></div>
    <button id="playPauseBtn" data-lg-aria="music-toggle" aria-pressed="false">
        <svg id="playing-icon" viewBox="0 0 24 24" width="20" height="20" stroke="currentColor" stroke-width="1.2" fill="none"
            stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
            <polygon points="11 5 6 9 2 9 2 15 6 15 11 19 11 5"></polygon>
            <path d="M19.07 4.93a10 10 0 0 1 0 14.14M15.54 8.46a5 5 0 0 1 0 7.07"></path>
        </svg>
        <svg id="muted-icon" viewBox="0 0 24 24" width="20" height="20" stroke="currentColor" stroke-width="1.2" fill="none"
            stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
            <polygon points="11 5 6 9 2 9 2 15 6 15 11 19 11 5"></polygon>
            <line x1="23" y1="9" x2="17" y2="15"></line>
            <line x1="17" y1="9" x2="23" y2="15"></line>
        </svg>
    </button>

    <script src="./script.js?v=7"></script>
</body>

</html>
